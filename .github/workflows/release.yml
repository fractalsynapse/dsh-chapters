name: Release

# Publishes the plugin package `@fractalsynapse/dsh-chapters` to npm
# (npm org 'fractalsynapse', GitHub org 'fractalsynapse' — the same NAME since
#  #261, still different homes; formerly npm scope 'treeseed' under 'treeseed-ai').
#
# Auth: the npm ACCESS TOKEN held as the `Production` environment secret
# NPM_TOKEN (#261). It replaces OIDC trusted publishing, whose package-side
# config was bound to the OLD repository identity — after the org move the
# registry answered the OIDC publish with a misleading 404 (the 0.2.17 attempt;
# nothing published, tag recorded dead in §26). The step appends an npmrc line
# holding only the LITERAL ${NPM_TOKEN}; npm interpolates it at use time, so the
# secret never enters a log or a written file. `id-token: write` REMAINS: npm
# signs provenance from the run's OIDC identity alongside a token publish; when
# a REPEATED attempt of the same commit re-submits the equivalent provenance
# entry, the transparency log answers 409 forever and npm aborts the publish
# (npm/cli#10078, measured shipping 0.2.18) — the step then retries WITHOUT
# provenance behind a loud ::warning::, so no tag is held hostage by its own
# transport history; the attestation degrades stated, never silently.
# setup-node keeps `registry-url` and NO `token:` input (the npmrc line below is
# the only credential path; a setup-node token input would write the VALUE).
#
# Two ways in:
#   1. push a version tag:  git tag 0.1.1 && git push origin 0.1.1
#      (bare semver — the 'Production' environment's tag protection is *.*.*)
#   2. Actions tab → "Run workflow" (manual dispatch; dry_run to rehearse)
# The gate is the FULL deterministic suite (incl. the 85/85/85 coverage gate);
# we do not publish on a red suite. The tape-replay acceptance chain runs in
# ci.yml on every push to main; here we re-run the deterministic plane.
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the actual publish'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build · test · publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 'Production' enforces tag protection *.*.* — a non-semver tag never
    # reaches this job. (#261: the environment ALSO carries NPM_TOKEN, the
    # publish credential; it was empty on the OIDC path.)
    environment: Production
    permissions:
      contents: read
      id-token: write # REQUIRED: mints the OIDC token npm trades for a
                      # one-time publish credential AND signs provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # The pinned host, BEFORE the publish blocker (#93) — the same step `ci.yml` grew on 2026-10-23
      # after PR #89's two red rows. `host-plan-card-shape.test.ts` and the overflow-classifier rows read
      # host FACTS out of the installed bundle and REFUSE the repo's stale 0.1.5-rc.2 closure, because a
      # drift gate against the wrong version is a rumor. Without this step the release job runs on a
      # checkout with no `dev/dsh-host-lock/node_modules`, so the gate fails correctly and nothing
      # publishes — measured on the 0.2.0 tag push (1126 tests, 1 fail, coverage itself passing).
      # The alternative, skipping those rows when the host is absent, would make a publish blocker
      # silently vacuous, which is the failure mode #89/#92 exist to end.
      - name: install the pinned DSH host for the host-fact rows
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/dev/dsh-host-lock" --no-save --no-audit --no-fund || (cd dev/dsh-host-lock && npm ci --no-audit --no-fund)
          echo "$GITHUB_WORKSPACE/dev/dsh-host-lock/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run build
      - name: deterministic suite + coverage gate (publish blocker)
        run: npm run coverage:ci

      # The tag IS the version: 0.1.1 ↔ "version": "0.1.1".
      - name: version / tag consistency
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::tag $GITHUB_REF_NAME ≠ package.json version $(node -p "require('./package.json').version") — bump before tagging"
            exit 1
          fi

      # What would ship (sanity: lib/, presets/, cordis.patch.yml, docs, README).
      - name: pack preview
        run: npm pack --dry-run 2>&1 | tail -30

      - name: publish (NPM_TOKEN from the Production environment; provenance via OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The single-quoted printf keeps ${NPM_TOKEN} LITERAL in the file — npm
          # expands it from the env at use time, so no step log or written file ever
          # carries the secret (project security rule: raw tokens never in output).
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> "$HOME/.npmrc"
          # Prerelease versions ('x.y.z-tag') ship under a matching dist-tag so
          # they never steal 'latest' from the last stable ship.
          V="$(node -p "require('./package.json').version")"
          DIST=()
          case "$V" in *-*) DIST=(--tag "${V#*-}") ;; esac
          # One attempt WITH provenance; the captured output is what distinguishes the
          # one retryable failure from a fatal transport error.
          if OUT="$(npm publish --provenance "${DIST[@]}" 2>&1)"; then
            printf '%s\n' "$OUT"
          elif printf '%s' "$OUT" | grep -q 'TLOG_CREATE_ENTRY_ERROR'; then
            # The self-collision class (measured shipping 0.2.18): an earlier FAILED
            # attempt of this same commit already signed and submitted the equivalent
            # provenance entry, the transparency log dedupes forever (npm/cli#10078),
            # and npm ABORTS the publish on the 409 — so re-running the tag can never
            # succeed. A tag must not be held hostage by transport history: republish
            # WITHOUT provenance, loudly — the version ships, the attestation does
            # not, and the warning says so (the §26 sentence allows for exactly this).
            printf '%s\n' "$OUT"
            echo "::warning::provenance submit collided with this build's own earlier transparency-log entry (npm/cli#10078) — republishing WITHOUT provenance; this version carries no attestation"
            npm publish --no-provenance "${DIST[@]}"
          else
            printf '%s\n' "$OUT"
            exit 1
          fi

      - name: shipped
        if: ${{ !inputs.dry_run }}
        run: |
          echo "@fractalsynapse/dsh-chapters@$(node -p "require('./package.json').version") is on npm — https://www.npmjs.com/package/@fractalsynapse/dsh-chapters"
          echo "provenance state is in the publish step output; the TLOG-collision fallback ships WITHOUT attestation and says so"
